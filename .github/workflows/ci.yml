name: CI

# El gate de siempre, en Ubuntu y **sin GDAL instalado**. Que pase sin GDAL no es un atajo:
# es el requisito. La capa de motores describe en vez de ejecutar justo para poder probarse
# asi, y si algun dia el CI necesitara GDAL seria senal de que algo se escribio mal.
#
# Las pruebas con oraculo externo van en `oraculo.yml`, aparte y sin bloquear.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: clave-solo-para-ci-no-se-usa-en-ningun-despliegue-y-larga-de-sobra
      DEBUG: "True"
      AEROCONVERT_MODO: taller
      # Obligatoria en modo taller: `manage.py check` falla sin ella, a proposito.
      AEROCONVERT_RAICES_PERMITIDAS: /tmp
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --all-groups --locked

      - name: manage.py check
        run: uv run python manage.py check

      # **El gate de produccion, que faltaba.** `verify.ps1` lo corre desde siempre y el CI
      # no, asi que un ajuste de despliegue roto pasaba el CI y se descubria en la VM.
      #
      # Y va con el modulo fijado a mano: sin `DJANGO_SETTINGS_MODULE`, `manage.py` cae en
      # `config.settings.dev` -- con DEBUG=True -- y `--deploy` no comprueba nada de lo que
      # importa. Es el mismo fallo que arrastraba `verify.ps1`.
      - name: manage.py check --deploy (con los ajustes de produccion de verdad)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: ci.example.org
          CSRF_TRUSTED_ORIGINS: https://ci.example.org
          AEROCONVERT_MODO: taller
          AEROCONVERT_RAICES_PERMITIDAS: /tmp/entregas
        run: |
          mkdir -p /tmp/entregas
          uv run python manage.py check --deploy

      # `collectstatic` con el almacen con manifiesto descubre un `sourceMappingURL` sin su
      # `.map`, un `integrity` desparejado o un estatico que falta. Aqui cuesta cinco
      # segundos; en la VM, **todas** las paginas dan 500 y el sintoma parece un error de
      # diseno. Ver apps/core/test_arranque.py.
      - name: collectstatic (el manifiesto de verdad)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: ci.example.org
          AEROCONVERT_RAICES_PERMITIDAS: /tmp/entregas
        run: uv run python manage.py collectstatic --noinput --clear

      - name: makemigrations --check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: pytest
        run: uv run pytest --cov=apps --cov-report=term-missing

      - name: ruff check
        run: uv run ruff check .

      # No es redundante con el anterior: `check` no mira el formato, y olvidarlo dejo el
      # CI de AeroControl rojo durante dias.
      - name: ruff format --check
        run: uv run ruff format --check .

      - name: bandit
        run: uv run bandit -q -c pyproject.toml -r apps config

      - name: pip-audit
        run: uv run pip-audit
