<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120"
     fill="none" stroke="#F15BB5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">AeroConvert</title>
  <desc id="descripcion">El dron de la familia Aero sobre dos placas unidas por flechas de
    intercambio: un archivo que se convierte en otro.</desc>

  <!-- Brazos, rotores y fuselaje: identicos en las cinco aplicaciones. La geometria no se
       toca; lo unico propio de cada una es el color del trazo y el motivo de abajo. -->
  <path d="M68 25 52 17M92 25l16-8M68 35 52 46M92 35l16 11" />
  <circle cx="42" cy="13" r="8" />
  <circle cx="118" cy="13" r="8" />
  <circle cx="42" cy="46" r="8" />
  <circle cx="118" cy="46" r="8" />
  <rect x="64" y="21" width="32" height="18" rx="8" fill="#1B2A4A" />
  <circle cx="74" cy="30" r="3" fill="#F15BB5" stroke="none" />
  <circle cx="86" cy="30" r="3" fill="#F15BB5" stroke="none" />

  <!-- El motivo propio: dos placas y dos flechas opuestas. Dice "de un formato a otro"
       sin una palabra, que es lo que hace la aplicacion. -->
  <rect x="36" y="62" width="28" height="40" rx="4" />
  <rect x="96" y="62" width="28" height="40" rx="4" />
  <path d="M68 76h18" />
  <path d="M81 71l5 5-5 5" />
  <path d="M92 90H74" />
  <path d="M79 85l-5 5 5 5" />
</svg>
