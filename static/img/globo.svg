<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -130 260 260">
  <!-- Globo con reticula: esfera, paralelos, un meridiano que la escena repite y hace girar, anillo
       graduado con su mira, un punto marcado y una orbita. Ilustracion propia, sin cartografia real.
       Solo geometria: el color y el movimiento los pone app.css sobre cada use. El origen es el
       centro del globo. -->
