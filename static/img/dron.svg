<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -50 200 100">
  <!-- Dron multirrotor estilizado, visto en tres cuartos: cuerpo, cuatro brazos con su motor, patines
       y camara colgada. Ilustracion propia, sin marca ni logo de nadie. Esta partido en capas para
       que cada una lleve su color desde app.css (el use los hereda): cuerpo (trazo y relleno),
       acento (la camara y los pilotos) y helice (la pala que gira). El origen es el centro del
       cuerpo. Las helices se dibujan en su propio centro, y la escena las coloca y las aplana. -->
  <defs>
    <g id="dron-cuerpo" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-20 12L-26 30M20 12L26 30M-32 30H-18M18 30H32" fill="none" stroke-width="3"/>
      <path d="M-22 -8L-60 -24M22 -8L60 -24M-22 8L-72 22M22 8L72 22" fill="none" stroke-width="5"/>
      <ellipse cx="-60" cy="-24" rx="7" ry="4"/>
      <ellipse cx="60" cy="-24" rx="7" ry="4"/>
      <ellipse cx="-72" cy="22" rx="8" ry="4.5"/>
      <ellipse cx="72" cy="22" rx="8" ry="4.5"/>
      <rect x="-27" y="-15" width="54" height="28" rx="12" stroke-width="3"/>
      <path d="M-15 -15Q0 -25 15 -15" fill="none" stroke-width="3"/>
    </g>
    <g id="dron-acento">
      <circle cx="0" cy="19" r="7"/>
      <circle cx="-17" cy="-2" r="2.4"/>
      <circle cx="17" cy="-2" r="2.4"/>
    </g>
    <g id="dron-lente">
      <circle cx="0" cy="19" r="3.2"/>
    </g>
    <ellipse id="dron-sombra" cx="0" cy="44" rx="44" ry="5"/>
    <g id="dron-disco">
      <circle r="20"/>
    </g>
    <g id="dron-helice" stroke-linecap="round">
      <path d="M-20 0H20" stroke-width="3" fill="none"/>
      <circle r="2.6"/>
    </g>
  </defs>
</svg>
