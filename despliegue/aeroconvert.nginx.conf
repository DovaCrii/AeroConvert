# AeroConvert detras de Tailscale.
#
# Se copia a /etc/nginx/sites-available/aeroconvert y se enlaza desde sites-enabled.
#
# ## Este fichero es OPCIONAL, y conviene saber por que
#
# Tailscale puede hablar directamente con gunicorn:
#
#     tailscale funnel --bg --https=8443 http://127.0.0.1:8001
#
# y eso ya funciona. nginx se mete en medio por **tres cosas que Tailscale no tiene**:
#
#   1. Un limite de peticiones sobre la pantalla de entrada. Contra un extremo publico, sin
#      esto alguien prueba contrasenas tan rapido como aguante la maquina. django-axes
#      bloquea por usuario, que es otra cosa: no frena el chorro.
#   2. Un tope de tamano de cuerpo que corte **antes** de llegar a Python.
#   3. Apagar el bufado para las descargas grandes.
#
# Si se monta, Tailscale apunta aqui en vez de a gunicorn:
#
#     tailscale funnel --bg --https=8443 http://127.0.0.1:8080

# --- La direccion de verdad de quien llama ---------------------------------
#
# **La trampa de esta topologia, y ya se colo una vez.** Lo natural es escribir
# `proxy_set_header X-Forwarded-For $remote_addr`, que es correcto cuando nginx es el primer
# salto. Aqui el primero es Tailscale, asi que `$remote_addr` es `127.0.0.1` **para todo el
# mundo**: el bloqueo por intentos fallidos volveria a ser «todos comparten una IP», que es
# justo el defecto que `apps/core/ip.py` existe para evitar.
#
# Con esto, nginx reemplaza `$remote_addr` por la direccion que puso Tailscale antes de
# aplicar ninguna regla, asi que tanto el registro como lo que se reenvia son la de verdad.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# Una zona de 10 MB guarda unas 160.000 direcciones. Tres intentos por minuto con rafagas de
# cinco: quien teclea mal dos veces no lo nota, y quien prueba un diccionario si.
limit_req_zone $binary_remote_addr zone=entrar:10m rate=3r/m;

server {
    # **Solo en el bucle local.** Quien publica es Tailscale; que nginx escuche en 0.0.0.0
    # abriria una segunda puerta sin TLS por la red de la oficina.
    listen 127.0.0.1:8080;
    server_name _;

    # 1 MB no vale ya: **ahora si hay subidas**. Tiene que ir por encima de
    # AEROCONVERT_TOPE_MB (200 por omision) con algo de margen para el resto del formulario;
    # si va por debajo, nginx corta antes y la persona ve un error del servidor en vez del
    # mensaje que explica que hacer.
    client_max_body_size 220m;

    access_log /var/log/nginx/aeroconvert.access.log;
    error_log  /var/log/nginx/aeroconvert.error.log;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # `$remote_addr` ya es la direccion de verdad, por el `real_ip_header` de arriba.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Que la aplicacion siga pudiendo distinguir una peticion de internet de una de la
        # red privada. Ver `apps/core/ip.py::viene_de_internet`.
        proxy_set_header Tailscale-Funnel-Request $http_tailscale_funnel_request;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # La pantalla de entrada, con freno. `nodelay` deja pasar la rafaga de golpe en vez de
    # encolarla: quien se equivoca teclea otra vez enseguida, quien ataca choca con el muro.
    location = /entrar/ {
        limit_req zone=entrar burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Tailscale-Funnel-Request $http_tailscale_funnel_request;
    }

    location /trabajos/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Una descarga son gigabytes. Con el bufado por omision, nginx escribe la respuesta
        # **entera** en /var/lib/nginx/proxy_temp antes de mandar el primer byte: llena el
        # disco del sistema con un archivo de 20 GB y ademas hace esperar a quien descarga.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
    }

    # Lo mismo para lo que entregan las pantallas de PDF.
    location /documentos/descargar/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
    }
}

# **No hay `location /static/` a proposito.** Whitenoise ya los sirve, con huella de
# contenido y `Cache-Control: immutable` (apps/core/estaticos.py). Un bloque aqui los
# serviria **sin** esa cabecera y reabriria el fallo que documenta
# apps/core/test_arranque.py: HTML nuevo pintado con la hoja de estilos vieja.
#
# Y tampoco `/media/`: lo que sube la gente **no se sirve por URL**. Sale por una vista que
# comprueba el dueno, porque si no la URL seria el permiso.
