# AeroConvert detras de nginx con TLS.
#
# Se copia a /etc/nginx/sites-available/aeroconvert y se enlaza desde sites-enabled.
# Cambia `aeroconvert.jej.cl` por el nombre real, y que coincida con ALLOWED_HOSTS.

server {
    listen 80;
    listen [::]:80;
    server_name aeroconvert.jej.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aeroconvert.jej.cl;

    ssl_certificate     /etc/letsencrypt/live/aeroconvert.jej.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeroconvert.jej.cl/privkey.pem;

    # 1 MB, y no 5 GB. **No hay ni una subida en la aplicacion**: ni el conversor ni las
    # herramientas de PDF reciben archivos -- reciben rutas de la carpeta compartida y las
    # comprueban contra AEROCONVERT_RAICES_PERMITIDAS. Poner 5g no habilitaria nada y
    # dejaria que alguien empuje 5 GB al disco del sistema. Cuando se escriba la subida,
    # este numero tendra que seguir a AEROCONVERT_TOPE_MB.
    client_max_body_size 1m;

    access_log /var/log/nginx/aeroconvert.access.log;
    error_log  /var/log/nginx/aeroconvert.error.log;

    location / {
        proxy_pass http://unix:/run/aeroconvert/gunicorn.sock;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # **Sobrescribe, no anexa**, y de esto depende que el bloqueo por intentos fallidos
        # no sea evadible. Con el habitual `$proxy_add_x_forwarded_for`, quien mande su
        # propia cabecera produce «9.9.9.9, <la de verdad>», y basta con leer mal la lista.
        # Ver el razonamiento entero en apps/core/ip.py.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /trabajos/ {
        proxy_pass http://unix:/run/aeroconvert/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una descarga son gigabytes. Con el bufado por omision, nginx escribe la respuesta
        # **entera** en /var/lib/nginx/proxy_temp antes de mandar el primer byte: llena el
        # disco del sistema con un archivo de 20 GB y ademas hace esperar a quien descarga.
        # Estas dos lineas son las que impiden que una descarga tumbe la maquina.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1800s;
    }
}

# **No hay `location /static/` a proposito.** Whitenoise ya los sirve, con huella de
# contenido y `Cache-Control: immutable` (apps/core/estaticos.py). Un bloque aqui los
# serviria **sin** esa cabecera y reabriria el fallo que documenta
# apps/core/test_arranque.py: HTML nuevo pintado con la hoja de estilos vieja.
