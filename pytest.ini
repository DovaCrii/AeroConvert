[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
# Las pruebas con oraculo externo (GDAL, PDAL, CloudCompare) quedan fuera por
# omision: el gate tiene que ser verde en una maquina sin GDAL instalado. Se
# corren a mano con `pytest -m oraculo`, y su resultado se anota con fecha en
# `docs/PRUEBAS_CON_ORACULO.md`.
addopts = -m "not oraculo"
markers =
    oraculo: exige una herramienta externa instalada (GDAL, PDAL). No corre en el gate.
